<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>MedSurg Quiz</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>


    <!-- ========================================
         QUIZ SELECTION SCREEN
         ======================================== -->

    <div class="screen" id="menu">

        <div class="quiz-container">

            <h1>MED-SURG QUIZ</h1>

            <p class="subtitle">
                Select a question bank
            </p>

            <div id="quizList">

                <p class="loading">
                    Loading quizzes...
                </p>

            </div>

        </div>

    </div>



    <!-- ========================================
         QUIZ SCREEN
         ======================================== -->

    <div class="screen" id="quizScreen" style="display: none;">

        <div class="quiz-container">

            <div class="quiz-header">

                <h1 id="quizTitle">
                    MED-SURG QUIZ
                </h1>

                <p id="questionNumber"></p>

            </div>


            <div id="question"></div>


            <div id="choices"></div>


            <button id="submitButton">
                SUBMIT
            </button>


            <div id="result"></div>


            <button id="nextButton"
                    style="display: none;">

                NEXT QUESTION

            </button>



            <!-- ========================================
                 10 QUESTION CHECKPOINT
                 ======================================== -->

            <div id="checkpoint"
                 class="checkpoint"
                 style="display: none;">

                <h2>
                    10 QUESTIONS COMPLETED
                </h2>

                <p id="checkpointScore"></p>

                <button id="continueButton">
                    CONTINUE
                </button>

                <button id="stopButton"
                        class="secondary-button">

                    STOP QUIZ

                </button>

            </div>



            <!-- ========================================
                 STOPPED SCREEN
                 ======================================== -->

            <div id="stoppedScreen"
                 style="display: none;">

                <h2>
                    QUIZ STOPPED
                </h2>

                <p id="stoppedScore"></p>

                <button id="returnMenuButton">
                    CHOOSE ANOTHER QUIZ
                </button>

            </div>



            <!-- ========================================
                 COMPLETE SCREEN
                 ======================================== -->

            <div id="completeScreen"
                 style="display: none;">

                <h2>
                    QUIZ COMPLETE
                </h2>

                <p id="finalScore"></p>

                <p id="finalPercentage"></p>

                <button id="retakeButton">
                    RETAKE QUIZ
                </button>

                <button id="completeMenuButton"
                        class="secondary-button">

                    CHOOSE ANOTHER QUIZ

                </button>

            </div>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
